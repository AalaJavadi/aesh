name: AESH PRODUCTION - approved-only v5 release
on:
  workflow_dispatch:
  schedule:
    - cron: '15,45 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: aesh-approved-production-publisher
  cancel-in-progress: false
jobs:
  build:
    # BOTH variables must be set deliberately AFTER real Supabase and GitHub QA.
    # By default this entire job is SKIPPED; no production deploy can occur.
    if: ${{ vars.AESH_PRODUCTION_RELEASE_APPROVED == 'true' && vars.AESH_PRODUCTION_REPOSITORY == github.repository && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install all pinned Python build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f requirements-build.txt
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip check
      - name: Preflight every Python build-tool import (fail closed)
        run: python tools/check_build_dependencies.py
      - name: Guard production source and only one publisher
        run: python tools/check_production_release.py --repo .
      - name: Validate production work buckets (read only, fails closed)
        env:
          AESH_PRODUCTION_RELEASE_APPROVED: ${{ vars.AESH_PRODUCTION_RELEASE_APPROVED }}
          AESH_PRODUCTION_SUPABASE_REF: ${{ vars.AESH_PRODUCTION_SUPABASE_REF }}
        run: python tools/check_production_privacy_readonly.py
      - name: Synchronize editor export fallbacks before immutable parity gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          from pathlib import Path
          import base64
          import json
          import re

          root = Path('.')
          manifest = json.loads((root / 'assets/aesh-package-files.json').read_text(encoding='utf-8'))
          needed = [p for p in manifest if p.startswith(('tools/', 'sql/', 'supabase/', '.github/'))
                    or ('/' not in p and p.endswith(('.md', '.txt')))]
          if not needed:
              raise SystemExit('FAIL: editor export has no build-tool sources')
          snapshots = {}
          for relative in needed:
              source = root / relative
              if not source.is_file():
                  raise SystemExit('FAIL: missing editor export source: ' + relative)
              snapshots[relative] = base64.b64encode(source.read_bytes()).decode('ascii')
          for filename, pattern in (
              ('assets/aesh-editor-immutable.js', r'window\.AESH_IMMUTABLE_FILES=(\{.*?\});'),
              ('editor/index.html', r'var AESH_EDITOR_EMBEDDED_FILES=(\{.*?\});'),
          ):
              target = root / filename
              original_text = target.read_text(encoding='utf-8')
              match = re.search(pattern, original_text, re.S)
              if not match:
                  raise SystemExit('FAIL: editor source snapshot missing: ' + filename)
              current = json.loads(match.group(1))
              updates = sum(current.get(k) != v for k, v in snapshots.items())
              current.update(snapshots)
              replacement = json.dumps(current, ensure_ascii=False, separators=(',', ':'))
              if updates:
                  target.write_text(original_text[:match.start(1)] + replacement + original_text[match.end(1):], encoding='utf-8')
              print(f'PASS: {filename}: {updates} updated snapshots')
          PYTHON
      - name: Verify immutable editor package, independent generators and Stage gates offline
        run: |
          python tools/check_editor_fallback_offline.py
          python tools/test_generated_pages_offline.py
          python tools/test_staged_and_archive_offline.py
      - name: Require public directory RPC before Production release (read only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json
          import sys
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          sys.path.insert(0, str(Path('tools').resolve()))
          import sync_directory_profiles as directory
          try:
              records, host = directory.fetch_rows()
          except HTTPError as exc:
              try:
                  payload = json.loads(exc.read(8192).decode('utf-8'))
              except (ValueError, UnicodeDecodeError):
                  payload = {}
              reason = payload.get('code') if isinstance(payload, dict) else None
              if exc.code == 404 and reason == 'PGRST202':
                  print('::error title=Production database RPC missing::aesh_public_directory() is absent from the Supabase public API. Do not deploy. Run the read-only directory check from the release kit; review migration in TEST before applying to Production.')
              else:
                  print(f'::error title=Directory RPC unavailable::HTTP {exc.code}, PostgREST code: {reason}')
              raise SystemExit(2)
          except (URLError, ValueError, OSError) as exc:
              print('::error title=Directory RPC unavailable::' + str(exc)[:220])
              raise SystemExit(2)
          print(f'PASS: directory RPC responded with {len(records)} public profiles')
          PYTHON
      - name: Sync published Cloud works from successful RPC snapshot
        run: python tools/sync_cloud_share.py
      - name: Sync published directory profiles from successful RPC snapshot
        run: python tools/sync_directory_profiles.py
      - name: Stage public files and enforce complete route manifest
        run: python tools/stage_site.py
      - name: Independent post-stage check
        run: python tools/verify_staged_site.py --source . --staged _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' && vars.AESH_PRODUCTION_RELEASE_APPROVED == 'true' && vars.AESH_PRODUCTION_REPOSITORY == github.repository && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only explicitly approved verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
