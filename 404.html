<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>در حال بررسی مسیر | AESH</title></head><body><p style="font-family:system-ui;text-align:center;margin-top:20vh">در حال بررسی آدرس…</p><script>(function(){
var gh=/\.github\.io$/i.test(location.hostname),base=gh&&location.hostname!=='aesh-test.github.io'?'/aesh/':'/';
var path=location.pathname.slice(base.length-1),found=path.match(/^\/(teacher|student)\/([^/]+)\/?$/);
if(found){location.replace(base+'directory-profile/?role='+encodeURIComponent(found[1])+'&slug='+encodeURIComponent(found[2]));return;}
var target=location.pathname+location.search+location.hash;
try{sessionStorage.setItem('aesh:404-route',target);}catch(e){}
location.replace(base+'?__aesh404=1');})();</script></body></html>
